# Included from every location in default.conf. nginx only inherits add_header
# from the server block when a location sets none of its own, so the locations
# that add Cache-Control would otherwise serve the app without these headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
