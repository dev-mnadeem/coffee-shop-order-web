server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a single-page application behind BrowserRouter: /items and
    # /order are client-side routes, so anything that is not a real file has to
    # come back as index.html or a refresh on /order would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html and the runtime config are not.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
