# The storefront on its own. The API it talks to lives in the sibling
# repository `agnos-coffee-shop-be`, which has its own compose file; point
# API_BASE_URL at wherever that is running.
#
#   docker compose up --build
#   open http://localhost:3000
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agnos-coffee-shop-fe:local
    ports:
      - '${WEB_PORT:-3000}:8080'
    environment:
      # Read by docker/entrypoint.sh and written into config.js at start-up.
      # host.docker.internal reaches an API running on the host; use the
      # service name instead if both repositories share a compose network.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:3001/api/v1}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
